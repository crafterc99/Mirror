<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIRROROS · Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #07060c;
      font-family: 'Geist', -apple-system, system-ui, sans-serif;
      color: rgba(245, 247, 255, 0.95);
      overflow: hidden;
    }
    * { box-sizing: border-box; }

    /* Page-level ambient backdrop (visible behind device in mobile mode) */
    .proto-stage {
      position: fixed; inset: 0; overflow: hidden;
      background:
        radial-gradient(60% 50% at 20% 20%, rgba(91, 99, 220, 0.25), transparent 60%),
        radial-gradient(50% 45% at 80% 80%, rgba(167, 139, 250, 0.2), transparent 65%),
        #07060c;
    }
    .proto-stage::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      opacity: 0.05; mix-blend-mode: overlay;
    }

    /* Mode toolbar */
    .proto-bar {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      z-index: 100; display: flex; align-items: center; gap: 6px;
      padding: 6px;
      background: linear-gradient(180deg, rgba(20,18,40,0.78), rgba(10,8,20,0.78));
      border: 0.5px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.08), 0 12px 32px rgba(0,0,0,0.5);
      font-family: 'Geist', system-ui, sans-serif;
      font-size: 12.5px;
    }
    .proto-bar button {
      border: 0; background: transparent; color: rgba(220,225,240,0.7);
      font: inherit; cursor: pointer; padding: 8px 14px; border-radius: 999px;
      display: inline-flex; align-items: center; gap: 6px;
      transition: background .15s, color .15s;
    }
    .proto-bar button:hover { color: rgba(245,247,255,0.95); }
    .proto-bar button.on {
      background: linear-gradient(180deg, rgba(167,139,250,0.95), rgba(111,123,255,0.95));
      color: white;
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.35), 0 0 16px rgba(167,139,250,0.4);
    }
    .proto-bar .sep {
      width: 1px; height: 18px; background: rgba(255,255,255,0.1); margin: 0 4px;
    }
    .proto-bar .step {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; letter-spacing: 0.2em;
      color: rgba(200,210,230,0.55); padding: 0 8px;
      white-space: nowrap; min-width: 56px; text-align: center;
    }
    .proto-bar button { white-space: nowrap; }
    .proto-bar .pill-link {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; letter-spacing: 0.18em;
      color: rgba(200,210,230,0.6);
      padding: 6px 12px; text-decoration: none;
      border-radius: 999px; transition: color .15s, background .15s;
    }
    .proto-bar .pill-link:hover {
      color: rgba(245,247,255,0.95); background: rgba(255,255,255,0.06);
    }

    /* Stage frames */
    .proto-mobile-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .proto-desktop-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }

    /* Fade between screens */
    .proto-fade {
      animation: proto-fade-in .45s ease;
    }
    @keyframes proto-fade-in {
      from { opacity: 0; transform: scale(0.992); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Shared MIRROROS screen styles (copied from index.html) */
    .mo-screen {
      position: absolute; inset: 0;
      background: #050508;
      color: rgba(245, 247, 255, 0.95);
      font-family: 'Geist', -apple-system, system-ui, sans-serif;
      overflow: hidden;
      letter-spacing: -0.01em;
    }
    .mo-serif { font-family: 'Instrument Serif', 'Times New Roman', serif; font-weight: 400; letter-spacing: -0.02em; }
    .mo-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    .mo-ambient {
      position: absolute; inset: -10%;
      background:
        radial-gradient(60% 50% at 28% 18%, rgba(111, 123, 255, 0.42) 0%, rgba(111, 123, 255, 0) 60%),
        radial-gradient(50% 45% at 78% 32%, rgba(167, 139, 250, 0.32) 0%, rgba(167, 139, 250, 0) 60%),
        radial-gradient(70% 55% at 50% 95%, rgba(77, 212, 232, 0.18) 0%, rgba(77, 212, 232, 0) 60%);
      filter: blur(8px);
      animation: mo-breathe 8s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .mo-ambient.soft {
      background:
        radial-gradient(55% 45% at 30% 25%, rgba(111, 123, 255, 0.28) 0%, rgba(111, 123, 255, 0) 60%),
        radial-gradient(45% 40% at 75% 75%, rgba(167, 139, 250, 0.22) 0%, rgba(167, 139, 250, 0) 65%);
    }
    .mo-ambient.deep {
      background:
        radial-gradient(80% 60% at 50% 30%, rgba(91, 99, 220, 0.55) 0%, rgba(91, 99, 220, 0) 55%),
        radial-gradient(60% 50% at 50% 80%, rgba(20, 18, 40, 1) 0%, rgba(20, 18, 40, 0) 70%);
    }
    @keyframes mo-breathe {
      0%   { opacity: 0.85; transform: scale(1)   translateY(0); }
      100% { opacity: 1.0;  transform: scale(1.06) translateY(-2%); }
    }

    .mo-grain {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.06; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    .mo-vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(90% 70% at 50% 40%, transparent 50%, rgba(0,0,0,0.45) 100%);
    }

    .mo-glass {
      background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border-radius: 22px;
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.08),
        0 12px 32px rgba(0,0,0,0.4);
    }
    .mo-glass.selected {
      border-color: rgba(167, 139, 250, 0.55);
      background: linear-gradient(180deg, rgba(167, 139, 250, 0.16), rgba(111, 123, 255, 0.06));
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.18),
        0 0 28px rgba(167, 139, 250, 0.35),
        0 12px 32px rgba(0,0,0,0.5);
    }

    .mo-pill {
      display: inline-flex; align-items: center; justify-content: center;
      height: 56px; padding: 0 28px; border-radius: 999px;
      font-family: 'Geist', system-ui, sans-serif; font-weight: 500; font-size: 16px;
      letter-spacing: -0.005em; color: rgba(245, 247, 255, 0.98);
      background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
      border: 0.5px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.25),
        0 8px 24px rgba(0,0,0,0.35);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }
    .mo-pill:hover { transform: translateY(-1px); }
    .mo-pill.primary {
      background: linear-gradient(180deg, rgba(167, 139, 250, 0.95), rgba(111, 123, 255, 0.95));
      border: 0.5px solid rgba(255,255,255,0.35);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.45),
        0 0 28px rgba(167, 139, 250, 0.45),
        0 12px 32px rgba(91, 99, 220, 0.4);
    }

    .mo-orb {
      position: relative; border-radius: 50%;
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.85) 0%, rgba(167,139,250,0.6) 25%, rgba(91,99,220,0.7) 55%, rgba(20,18,40,0.95) 90%);
      box-shadow:
        inset 0 0 30px rgba(255,255,255,0.18),
        0 0 60px rgba(167, 139, 250, 0.55),
        0 0 120px rgba(111, 123, 255, 0.4);
      animation: mo-orb-breathe 4s ease-in-out infinite alternate;
    }
    .mo-orb::before {
      content: ""; position: absolute; inset: 8%; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.4), transparent 50%);
      filter: blur(4px);
    }
    @keyframes mo-orb-breathe {
      0%   { transform: scale(0.96); filter: brightness(0.95); }
      100% { transform: scale(1.04); filter: brightness(1.1); }
    }

    .mo-wave { display: flex; align-items: center; gap: 3px; height: 56px; }
    .mo-wave i {
      display: block; width: 3px; border-radius: 2px;
      background: linear-gradient(180deg, #cfd6ff, #a78bfa);
      animation: mo-wave 1.4s ease-in-out infinite;
    }
    @keyframes mo-wave {
      0%, 100% { height: 8px; opacity: 0.6; }
      50%      { height: 100%; opacity: 1; }
    }

    .mo-journal textarea {
      width: 100%; min-height: 280px; border: 0; outline: 0; resize: none;
      background: transparent; color: rgba(245, 247, 255, 0.95);
      font-family: 'Instrument Serif', serif;
      font-size: 26px; line-height: 1.45; letter-spacing: -0.01em;
    }
    .mo-journal textarea::placeholder { color: rgba(200, 210, 230, 0.32); }

    .mo-tap { cursor: pointer; transition: transform 0.15s ease, opacity 0.2s ease; }
    .mo-tap:active { transform: scale(0.98); }

    /* hide scrollbars in transcript etc */
    *::-webkit-scrollbar { width: 6px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
  </style>
</head>
<body>
  <div class="proto-stage"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="prototype-mobile.jsx"></script>
  <script type="text/babel" src="prototype-desktop.jsx"></script>
  <script type="text/babel" src="prototype-app.jsx"></script>
</body>
</html>
